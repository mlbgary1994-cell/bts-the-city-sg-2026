<style>
:root{--red:#c81d25;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#fff;--soft:#f8fafc;--sheet-h:46vh}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#e5e7eb;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:0 0 auto;background:linear-gradient(120deg,#18181b,#4c0519 60%,#9f1239);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;z-index:1200}
header .ttl{flex:1;min-width:0}
header h1{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header p{font-size:11px;color:#fecdd3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;min-width:38px;height:38px;padding:0 9px;font-size:16px}
.hbtn.on{background:#fff;color:#9f1239}
#body{flex:1;position:relative;display:flex;min-height:0}
#map{flex:1;min-height:0;background:#dbeafe}
#panel{background:var(--bg);display:flex;flex-direction:column;z-index:1100;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;background:none;border:none;padding:10px 4px;font-size:13px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent}
.tab.on{color:var(--red);border-bottom-color:var(--red)}
.pane{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.pane.on{display:block}
.pad{padding:10px 12px}
.sticky{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.search{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:var(--soft)}
.row{display:flex;gap:6px;overflow-x:auto;padding:7px 0 2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.chip.trip{border-color:#f59e0b;background:#fffbeb}
.chip.trip.on{background:#b45309;border-color:#b45309;color:#fff}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.count{font-size:12px;color:var(--mut);padding:6px 2px 0}
.zh{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.5px;margin:12px 2px 6px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;background:#fff}
.card:active{background:#fff1f2}
.card .nm{font-weight:800;font-size:14.5px}
.card .en{font-size:11.5px;color:var(--mut)}
.ev{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.5}
.ev b{font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;color:#fff;margin-right:4px;vertical-align:1px}
.bd{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:3px;vertical-align:1px}
.b-free{background:#d1fae5;color:#065f46}.b-ticket{background:#fee2e2;color:#991b1b}.b-mixed{background:#fef3c7;color:#92400e}
.b-spend{background:#e0e7ff;color:#3730a3}.b-resv{background:#fce7f3;color:#9d174d}.b-stamp{background:#f59e0b;color:#fff}
.b-upd{background:#0ea5e9;color:#fff}.b-now{background:#16a34a;color:#fff}
.muted{color:var(--mut)}
.note{font-size:12px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 10px;margin:8px 0;line-height:1.5}
/* itinerary */
.day{margin-bottom:4px}
.tl{position:relative;margin-left:8px;border-left:2px solid #e5e7eb;padding-left:14px}
.st{position:relative;padding:6px 0;font-size:13px;line-height:1.45}
.st:before{content:"";position:absolute;left:-21px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--c,#334155);border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.st .tm{font-weight:800;color:#334155;margin-right:6px;font-variant-numeric:tabular-nums}
.sg{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:12.5px;line-height:1.5;border:1px solid var(--line);background:var(--soft)}
.sg.fit-順路{border-color:#86efac;background:#f0fdf4}.sg.fit-小繞路{border-color:#93c5fd;background:#eff6ff}
.sg.fit-選配,.sg.fit-非演唱會組{border-color:#d8b4fe;background:#faf5ff}.sg.fit-衝突,.sg.fit-時段不合{border-color:#fecaca;background:#fef2f2}
.sg.fit-待確認,.sg.fit-注意{border-color:#fde68a;background:#fffbeb}
.fit{font-weight:800;font-size:11px;padding:1px 7px;border-radius:999px;background:#334155;color:#fff;margin-right:5px}
.sg .go{color:#1d4ed8;text-decoration:underline;cursor:pointer}
/* routes */
.rt{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 11px;margin-bottom:9px}
.rt.on{box-shadow:0 0 0 2px var(--c)}
.rt .nm{font-weight:800;font-size:14.5px}
.kv{font-size:12px;color:#334155;margin-top:3px;line-height:1.5}
.ol{margin:6px 0 0 18px;font-size:12.5px;line-height:1.6}
.act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;color:#fff;background:var(--ink);text-decoration:none;display:inline-block}
.btn.g{background:#1d4ed8}.btn.o{background:#fff;color:var(--ink);border:1px solid #cbd5e1}
/* stamps */
.sp{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:7px}
.sp input{width:22px;height:22px;margin-top:2px;accent-color:#d97706;flex:0 0 auto}
.sp.done{background:#fffbeb;border-color:#fcd34d}
.sp .nm{font-weight:800;font-size:13.5px}
.prog{height:8px;background:#f1f5f9;border-radius:99px;overflow:hidden;margin:6px 0 10px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#dc2626)}
/* map bits */
.pin{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.pin{font-size:14px}
.dim .leaflet-marker-pane .pin,.dim .leaflet-marker-pane .mc{opacity:.32}
.pin.star{outline:3px solid #fbbf24;outline-offset:-1px}
.npin{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--c);color:var(--ink);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.ipin{min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:var(--c);color:#fff;border:2px solid #fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.leaflet-popup-content{margin:12px 13px;min-width:250px;max-width:300px;font-size:13px;line-height:1.5}
.pp-t{font-weight:900;font-size:15px}
.pp-en{font-size:11.5px;color:var(--mut)}
.pp-ad{font-size:11.5px;background:#f1f5f9;border-radius:6px;padding:3px 6px;margin:5px 0}
.pp-ev{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.pp-sc{max-height:46vh;overflow-y:auto}
.leaflet-container a.btn,.act a.btn{color:#fff}.leaflet-container a.btn.o{color:var(--ink)}
.mc{width:36px;height:36px;border-radius:50%;background:rgba(200,29,37,.25);display:flex;align-items:center;justify-content:center}
.mc>div{width:28px;height:28px;border-radius:50%;background:#9f1239;color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mc.star>div{outline:3px solid #fbbf24}
.legend{background:rgba(255,255,255,.95);padding:7px 9px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:11.5px;line-height:1.65}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:3000;display:none;max-width:90vw}
#menu{position:fixed;right:10px;top:58px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:3000;display:none;min-width:210px;overflow:hidden}
#menu button,#menu a{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:11px 14px;font-size:14px;color:var(--ink);text-decoration:none}
/* mobile: bottom sheet */
@media (max-width:899px){
  #body{flex-direction:column}
  #panel{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.22);transition:height .22s ease;padding-bottom:env(safe-area-inset-bottom)}
  #panel.drag{transition:none}
  #grab{flex:0 0 auto;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
  #grab:before{content:"";width:44px;height:5px;border-radius:9px;background:#cbd5e1}
  #map{position:absolute;inset:0}
  .leaflet-bottom{bottom:calc(var(--sheet-h) + 4px)}
  .leaflet-control-layers-expanded{max-height:45vh;overflow:auto}
}
@media (max-width:899px) and (orientation:landscape) and (max-height:520px){
  header{padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px} header p{display:none} .hbtn{height:32px;min-width:34px}
  #body{flex-direction:row} #panel{position:relative;height:auto;width:min(46vw,400px);border-radius:0;box-shadow:none;border-right:1px solid var(--line);order:-1;padding-left:env(safe-area-inset-left)}
  #grab{display:none} #map{position:relative;inset:auto} .leaflet-bottom{bottom:0}
}
@media (max-width:359px){ header h1{font-size:13.5px} .tab{font-size:12px} .hbtn{min-width:34px;padding:0 6px} }
@media (min-width:900px){
  #panel{width:420px;border-right:1px solid var(--line);order:-1}
  #grab{display:none}
}
@media (min-width:1400px){ #panel{width:460px} }
</style>

const FIT_C = {'順路':'#16a34a','小繞路':'#2563eb','選配':'#9333ea','非演唱會組':'#9333ea','衝突':'#dc2626','時段不合':'#dc2626','待確認':'#d97706','注意':'#d97706','無':'#64748b'};
const KIND_C = {fly:'#0f172a',move:'#475569',sight:'#0369a1',food:'#ea580c',hotel:'#7c3aed',bts:'#c81d25'};
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200); }

/* ---------- 時間（SGT） ---------- */
function sgtNow(){ const n=new Date(); return new Date(n.getTime()+n.getTimezoneOffset()*60000+8*3600000); }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDay = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const toMin = hm => { const [h,m]=hm.split(':').map(Number); return h*60+m; };
function onDate(p, d){
  if (p.closed_dow){ const w=new Date(d+'T00:00:00').getDay(); if(p.closed_dow.includes(w)) return false; }
  if (p.dates) return p.dates.includes(d);
  return p.s && d >= p.s && d <= p.e;
}
function liveNow(p){
  if (!p.h) return false;
  const n=sgtNow(), today=ymd(n), mins=n.getHours()*60+n.getMinutes(), yest=addDay(today,-1);
  return p.h.some(([a,b])=>{ const A=toMin(a),B=toMin(b);
    if (onDate(p,today) && mins>=A && mins<Math.min(B,1440)) return true;
    if (B>1440 && onDate(p,yest) && mins < B-1440) return true; return false; });
}
function fmtRange(p){
  if (p.dates){ return p.dates.length>6 ? `${md(p.dates[0])}–${md(p.dates[p.dates.length-1])}（指定日）` : p.dates.map(md).join('、'); }
  return p.s===p.e ? md(p.s) : `${md(p.s)}–${md(p.e)}`;
}
function md(s){ const d=new Date(s+'T00:00:00'); const y=d.getFullYear()!==2026?`${d.getFullYear()}/`:''; return `${y}${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; }

const dark  = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:'abcd',attribution:'&copy; OpenStreetMap contributors &copy; CARTO'});
const osm   = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
const esri  = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});
const map = L.map('map',{zoomControl:false, layers:[carto], tap:true}).setView([1.2895,103.852],14);
L.control.zoom({position:'topright'}).addTo(map);
L.control.scale({metric:true,imperial:false,position:'bottomleft'}).addTo(map);
const bases = {'CARTO 街道（預設）':carto,'CARTO 夜間賞燈':dark,'OpenStreetMap':osm,'Esri 衛星影像':esri};
const mrt = L.layerGroup(D.mrt.map(s=>L.circleMarker([s[1],s[2]],{radius:5,color:'#fff',weight:2,fillColor:'#0f172a',fillOpacity:.95}).bindTooltip('MRT '+s[0],{direction:'top'})));
const layersCtl = L.control.layers(bases,{'MRT 參考站':mrt},{position:'topright',collapsed:true}).addTo(map);
const legend = L.control({position:'bottomright'});
legend.onAdd = () => { const d=L.DomUtil.create('div','legend'); d.innerHTML = Object.entries(D.cats).map(([k,[n,c]])=>`<div><i style="background:${c}"></i>${EMO[k]} ${n}</div>`).join('') + '<div><i style="background:#fff;outline:3px solid #fbbf24"></i>集章點 ★</div>'; L.DomEvent.disableClickPropagation(d); return d; };
if (!isSheet() && innerHeight > 600) legend.addTo(map);

const PROG = Object.fromEntries(D.programs.map(p=>[p.id,p]));
const VEN = D.venues;
const venueProgs = {}; D.programs.forEach(p=>p.v.forEach(k=>(venueProgs[k]=venueProgs[k]||[]).push(p)));
const CAT_ORDER = Object.keys(D.cats);
function topCat(ps){ return ps.map(p=>p.cat).sort((a,b)=>CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b))[0]; }
function venueColor(ps){ return D.cats[topCat(ps)][1]; }
function pinIcon(k, ps){
  const star = ps.some(p=>p.stamp);
  return L.divIcon({className:'',html:`<div class="pin ${star?'star':''}" style="background:${venueColor(ps)}">${star?'★':EMO[topCat(ps)]}</div>`,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14]});
}
function gmapsWalk(lat,lng){ return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`; }
function progHTML(p, live){
  const [cn,cc] = D.cats[p.cat]; const [fn,fc] = FEE[p.fee]||['',''];
  return `<div class="pp-ev"><span class="tag" style="background:${cc}">${cn}</span><b>${esc(p.t)}</b>${p.stamp?'<span class="bd b-stamp">★集章</span>':''}${live?'<span class="bd b-now">進行中</span>':''}
    <div>${esc(p.zh)}</div><div>📅 ${fmtRange(p)}　⏰ ${esc(p.time)}</div><div><span class="bd ${fc}" style="margin-left:0">${fn}</span>${p.upd?'<span class="bd b-upd">11/24 更新</span>':''}</div></div>`;
}
function popupHTML(k){
  const v = VEN[k], ps = venueProgs[k]||[];
  return `<div class="pp-t">${esc(v[0])}</div><div class="pp-en">${esc(v[1])}</div>
    <div class="pp-ad">📍 ${esc(v[4])}${v[6]?'　<span class="muted">（推估位置，以現場為準）</span>':''}</div>
    <div class="pp-sc">${ps.map(p=>progHTML(p, liveNow(p))).join('')}</div>
    <div class="act"><a class="btn g" href="${gmapsWalk(v[2],v[3])}" target="_blank" rel="noopener">Google 步行導航</a>
    <a class="btn o" href="https://www.openstreetmap.org/?mlat=${v[2]}&mlon=${v[3]}#map=18/${v[2]}/${v[3]}" target="_blank" rel="noopener">OSM</a></div>`;
}
const cluster = L.markerClusterGroup({disableClusteringAtZoom:16, maxClusterRadius:38, showCoverageOnHover:false, spiderfyOnMaxZoom:true,
  iconCreateFunction:c=>{ const ms=c.getAllChildMarkers(); const star=ms.some(m=>m.options._star); return L.divIcon({className:'',html:`<div class="mc ${star?'star':''}"><div>${ms.length}</div></div>`,iconSize:[36,36],iconAnchor:[18,18]}); }});
function fitTo(b, maxZoom){ const mob=isSheet(); const sh=mob?$('#panel').getBoundingClientRect().height:0; map.fitBounds(b,{paddingTopLeft:[30,30],paddingBottomRight:[mob?30:60, sh+24], maxZoom:maxZoom||17}); }
map.addLayer(cluster);
const markers = {};
Object.keys(VEN).forEach(k=>{
  if (!venueProgs[k]) return;
  const v=VEN[k];
  markers[k] = L.marker([v[2],v[3]],{icon:pinIcon(k,venueProgs[k]), title:v[0], _star:venueProgs[k].some(p=>p.stamp)}).bindPopup(()=>popupHTML(k),{maxWidth:310, autoPanPaddingTopLeft:[10,70]});
});
function focusVenue(k, z){
  const m = markers[k]; if(!m) return;
  if (!cluster.hasLayer(m)) cluster.addLayer(m);
  if (isSheet()) setSheet('peek');
  cluster.zoomToShowLayer(m, ()=>{ const zz=Math.max(map.getZoom(), z||17); const mob=isSheet(); let ll=m.getLatLng();
    if(mob){ const pt=map.project(ll,zz); pt.y += ($('#panel').getBoundingClientRect().height)/2 - 120; ll=map.unproject(pt,zz); }
    map.setView(ll, zz); setTimeout(()=>m.openPopup(),260); });
}

/* ---------- 活動清單 ---------- */
const TRIP = new Set(D.itin.map(d=>d.d));
let F = {date:'all', cats:new Set(), q:'', stamp:false, free:false, live:false, trip:false};
(function initFilters(){
  const days=[]; for(let d='2026-12-01'; d<='2027-01-03'; d=addDay(d,1)) days.push(d);
  const today = ymd(sgtNow());
  $('#dateRow').innerHTML = `<button class="chip on" data-d="all">全部日期</button>` + days.map(d=>{
    const t=new Date(d+'T00:00:00'); const c=[17,19,20,22].includes(t.getDate())&&t.getMonth()===11?'🎤':'';
    return `<button class="chip ${TRIP.has(d)?'trip':''}" data-d="${d}">${d===today?'今天 ':''}${t.getMonth()+1}/${t.getDate()}(${WD[t.getDay()]})${c}</button>`; }).join('');
  $('#catRow').innerHTML = Object.entries(D.cats).map(([k,[n,c]])=>`<button class="chip" data-c="${k}"><span class="dot" style="background:${c}"></span>${n}</button>`).join('');
  $('#flagRow').innerHTML = `<button class="chip" data-f="trip">🧳 我的行程日 12/18–23</button><button class="chip" data-f="live">🟢 現在進行中</button><button class="chip" data-f="stamp">★ 集章點</button><button class="chip" data-f="free">免費</button>`;
  $('#dateRow').onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; F.date=b.dataset.d; $$('#dateRow .chip').forEach(x=>x.classList.toggle('on',x===b)); render(); };
  $('#catRow').onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; const c=b.dataset.c; F.cats.has(c)?F.cats.delete(c):F.cats.add(c); b.classList.toggle('on'); render(); };
  $('#flagRow').onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; const f=b.dataset.f; F[f]=!F[f]; b.classList.toggle('on',F[f]); render(); };
  $('#q').oninput = e=>{ F.q=e.target.value.trim().toLowerCase(); render(); };
  if (days.includes(today)) { const b=$(`#dateRow .chip[data-d="${today}"]`); if(b){ b.click(); setTimeout(()=>b.scrollIntoView({inline:'center',block:'nearest'}),50);} }
})();
function pass(p){
  if (F.cats.size && !F.cats.has(p.cat)) return false;
  if (F.date!=='all' && !onDate(p,F.date)) return false;
  if (F.trip && ![...TRIP].some(d=>onDate(p,d))) return false;
  if (F.stamp && !p.stamp) return false;
  if (F.free && p.fee!=='free') return false;
  if (F.live && !liveNow(p)) return false;
  if (F.q){ const txt=(p.t+' '+p.zh+' '+p.v.map(k=>VEN[k][0]+' '+VEN[k][1]+' '+VEN[k][4]).join(' ')).toLowerCase(); if(!txt.includes(F.q)) return false; }
  return true;
}
function render(){
  const ok = D.programs.filter(pass), okIds = new Set(ok.map(p=>p.id));
  const vis = Object.keys(markers).filter(k=>venueProgs[k].some(p=>okIds.has(p.id)));
  cluster.clearLayers(); cluster.addLayers(vis.map(k=>markers[k]));
  const byZone = {};
  vis.forEach(k=>(byZone[VEN[k][5]]=byZone[VEN[k][5]]||[]).push(k));
  let h='';
  const floating = ok.filter(p=>!p.v.length);
  if (floating.length) h += `<div class="zh">待公布地點／全島</div>` + floating.map(p=>`<div class="card">${progHTML(p, liveNow(p)).replace('pp-ev','')}</div>`).join('');
  D.zones.forEach(z=>{ if(!byZone[z]) return; h+=`<div class="zh">${z}</div>`;
    byZone[z].forEach(k=>{ const v=VEN[k], ps=venueProgs[k].filter(p=>okIds.has(p.id));
      h+=`<div class="card" data-k="${k}"><div class="nm">${esc(v[0])} ${ps.some(p=>p.stamp)?'<span class="bd b-stamp">★</span>':''}</div><div class="en">${esc(v[1])}</div>`+
        ps.map(p=>{ const [cn,cc]=D.cats[p.cat]; const [fn,fc]=FEE[p.fee]||['',''];
          return `<div class="ev"><span class="tag" style="background:${cc}">${cn}</span><b>${esc(p.t)}</b>${p.stamp?'<span class="bd b-stamp">★</span>':''}${liveNow(p)?'<span class="bd b-now">進行中</span>':''}<br><span class="muted">${fmtRange(p)}｜${esc(p.time)}</span><span class="bd ${fc}">${fn}</span></div>`; }).join('') + `</div>`; }); });
  $('#list').innerHTML = h || '<div class="note">沒有符合條件的活動，請放寬篩選。</div>';
  $('#cnt').textContent = `符合 ${ok.length} 項活動・${vis.length} 個地點`;
}
$('#list').onclick = e=>{ const c=e.target.closest('.card[data-k]'); if(c) focusVenue(c.dataset.k); };
render();
setTimeout(()=>fitTo(L.latLngBounds([[1.2795,103.840],[1.3045,103.875]]), 15), 60);

/* ---------- 我的行程 ---------- */
const itinLayer = L.layerGroup().addTo(map);
let curDay = null;
$('#dayRow').innerHTML = D.itin.map((d,i)=>`<button class="chip trip" data-i="${i}">${d.label.split('（')[0]}（${d.label.split('（')[1].slice(0,1)}）</button>`).join('') + `<button class="chip" data-i="-1">隱藏行程</button>`;
$('#dayRow').onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; showDay(+b.dataset.i); };
function showDay(i){
  $$('#dayRow .chip').forEach(x=>x.classList.toggle('on', +x.dataset.i===i));
  itinLayer.clearLayers(); curDay=i; routeLayer.clearLayers(); curRoute=null; $$('.rt').forEach(x=>x.classList.remove('on'));
  map.getContainer().classList.toggle('dim', i>=0);
  if (i<0){ $('#itin').innerHTML='<div class="note">行程圖層已隱藏。</div>'; return; }
  const d = D.itin[i], pts=[];
  d.stops.forEach((s,j)=>{ const ll=D.poi[s[2]]; pts.push(ll);
    L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="ipin" style="--c:${KIND_C[s[3]]}">${j+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]}), zIndexOffset:1000})
     .bindPopup(`<div class="pp-t">${j+1}. ${esc(s[1])}</div><div>⏰ ${s[0]}</div>${s[4]?`<div class="muted">${esc(s[4])}</div>`:''}<div class="act"><a class="btn g" href="https://www.google.com/maps/dir/?api=1&destination=${ll[0]},${ll[1]}" target="_blank" rel="noopener">Google 導航</a></div>`).addTo(itinLayer); });
  L.polyline(pts,{color:'#0f172a',weight:3,opacity:.65,dashArray:'6 8'}).addTo(itinLayer);
  const btsV = new Set(); d.bts.forEach(b=>{ if(b[1]) PROG[b[1]].v.forEach(k=>btsV.add(k)); });
  const nearV = [...btsV].filter(k=>{ const v=VEN[k]; return pts.some(p=>Math.hypot((p[0]-v[2])*111, (p[1]-v[3])*111) < 8); });
  nearV.forEach(k=>{ const v=VEN[k]; L.circleMarker([v[2],v[3]],{radius:17,color:'#f59e0b',weight:3,fill:false,dashArray:'4 4',interactive:false}).addTo(itinLayer); });
  if (isSheet()) setSheet('half');
  setTimeout(()=>fitTo(L.latLngBounds(pts.concat(nearV.map(k=>[VEN[k][2],VEN[k][3]]))), 15), 260);
  $('#itin').innerHTML = `<div class="day"><div style="font-weight:900;font-size:15px;margin-bottom:6px">${esc(d.label)}</div>
    <div class="tl">${d.stops.map((s,j)=>`<div class="st" style="--c:${KIND_C[s[3]]}"><span class="tm">${s[0]}</span><b>${j+1}. ${esc(s[1])}</b>${s[4]?`<div class="muted">${esc(s[4])}</div>`:''}</div>`).join('')}</div>
    <div class="zh">順路 BTS THE CITY 活動</div>
    ${d.bts.map(b=>{ const p=b[1]?PROG[b[1]]:null; return `<div class="sg fit-${b[2]}"><span class="fit" style="background:${FIT_C[b[2]]||'#334155'}">${b[2]}</span><b>${b[0]}</b>　${p?`<span class="go" data-p="${p.id}">${esc(p.t)}</span>${p.stamp?'<span class="bd b-stamp">★</span>':''}`:''}<div>${esc(b[3])}</div></div>`; }).join('')}</div>`;
}
$('#itin').onclick = e=>{ const g=e.target.closest('.go'); if(!g) return; const p=PROG[g.dataset.p]; if(p&&p.v.length){ const d=D.itin[curDay]; const ref=d?D.poi[d.stops[0][2]]:null;
  let best=p.v[0]; if(ref){ best=p.v.slice().sort((a,b)=>Math.hypot(VEN[a][2]-ref[0],VEN[a][3]-ref[1])-Math.hypot(VEN[b][2]-ref[0],VEN[b][3]-ref[1]))[0]; } focusVenue(best); } else toast('地點待公布'); };

/* ---------- 散步路線 ---------- */
const routeLayer = L.layerGroup().addTo(map);
let curRoute=null;
function gmRoute(r){
  const pts=r.stops.map(k=>[VEN[k][2],VEN[k][3]]);
  const o=r.start||pts[0], dst=pts[pts.length-1], wp=pts.slice(r.start?0:1,-1).slice(0,8);
  return `https://www.google.com/maps/dir/?api=1&origin=${o[0]},${o[1]}&destination=${dst[0]},${dst[1]}&waypoints=${wp.map(p=>p.join(',')).join('%7C')}&travelmode=walking`;
}
$('#routes').innerHTML = `<div class="note">路線依 OpenStreetMap 步行路網計算（OSRM foot），時間以時速 4.5 km 估算，不含停留。夜線①＋② 可連走約 8 km，建議分兩晚或只走②。</div>` +
  D.routes.map(r=>{ const km=(r.d/1000).toFixed(1), min=Math.round(r.d/75);
   return `<div class="rt" id="rt-${r.id}" style="--c:${r.color}"><div class="nm">${esc(r.name)}</div>
    <div class="kv">🚶 ${km} km・步行約 ${min} 分（不含停留）</div><div class="kv">🕖 ${esc(r.when)}</div>
    <div class="kv">🟢 起點 ${esc(r.from)} → 🏁 ${esc(r.to)}</div>
    <ol class="ol">${r.stops.map(k=>`<li>${esc(VEN[k][0])}${(venueProgs[k]||[]).some(p=>p.stamp)?' ★':''}</li>`).join('')}</ol>
    <div class="kv" style="margin-top:6px">💡 ${esc(r.tip)}</div>
    <div class="act"><button class="btn" data-r="${r.id}">在地圖顯示</button><a class="btn g" href="${gmRoute(r)}" target="_blank" rel="noopener">Google 步行導航</a></div></div>`; }).join('');
$('#routes').onclick = e=>{ const b=e.target.closest('button[data-r]'); if(b) showRoute(b.dataset.r); };
function showRoute(id){
  routeLayer.clearLayers(); $$('.rt').forEach(x=>x.classList.toggle('on', x.id==='rt-'+id));
  if (curRoute===id){ curRoute=null; map.getContainer().classList.remove('dim'); return; } curRoute=id;
  itinLayer.clearLayers(); curDay=null; $$('#dayRow .chip').forEach(x=>x.classList.remove('on')); map.getContainer().classList.add('dim');
  const r=D.routes.find(x=>x.id===id);
  L.polyline(r.g,{color:'#fff',weight:9,opacity:.9}).addTo(routeLayer);
  const line=L.polyline(r.g,{color:r.color,weight:5,opacity:.95}).addTo(routeLayer);
  r.stops.forEach((k,i)=>{ const v=VEN[k]; L.marker([v[2],v[3]],{icon:L.divIcon({className:'',html:`<div class="npin" style="--c:${r.color}">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]}),zIndexOffset:900})
     .on('click',()=>focusVenue(k)).addTo(routeLayer); });
  if (isSheet()) setSheet('peek');
  setTimeout(()=>fitTo(line.getBounds()), 260);
  if (r.id.startsWith('R1') && !map.hasLayer(dark)) toast('夜線提示：右上 🌙 可切換夜間底圖');
}

/* ---------- 集章 ---------- */
let done = new Set(store.get('bts_sg_stamps',[]));
function renderStamps(){
  const sps = D.programs.filter(p=>p.stamp);
  const groups = {}; sps.forEach(p=>{ const key = p.id==='P42'||p.id==='P43' ? 'zouk' : p.id; (groups[key]=groups[key]||[]).push(p); });
  const items = Object.entries(groups);
  const n = items.filter(([k])=>done.has(k)).length;
  $('#spCnt').textContent = `${n}/${items.length}`;
  $('#stamps').innerHTML = `<div class="prog"><i style="width:${n/items.length*100}%"></i></div>
   <div class="note">官方集章點共 ${items.length} 處，集章細節（領獎方式）官方將另行公告。勾選紀錄只存在本機瀏覽器。🧳 標示＝可排進你的 12/18–12/23 行程。</div>` +
   items.map(([k,ps])=>{ const p=ps[0], v=p.v[0]?VEN[p.v[0]]:null, inTrip = ps.some(x=>D.itin.some(d=>d.bts.some(b=>b[1]===x.id && !['衝突','時段不合'].includes(b[2]))));
     return `<label class="sp ${done.has(k)?'done':''}"><input type="checkbox" data-k="${k}" ${done.has(k)?'checked':''}><div><div class="nm">${inTrip?'🧳 ':''}${esc(p.t.replace(' — Countdown Night',''))}</div>
      <div class="kv">${v?esc(v[0]):'地點待公布（ARMY MADANG）'}｜${ps.map(fmtRange).join('、')}｜${esc(p.time)}</div>
      <div class="kv"><span class="bd ${FEE[p.fee][1]}" style="margin-left:0">${FEE[p.fee][0]}</span>${v?` <span class="go" style="color:#1d4ed8;text-decoration:underline" data-v="${p.v[0]}">地圖</span>`:''}</div></div></label>`; }).join('');
}
$('#stamps').onchange = e=>{ const c=e.target.closest('input[data-k]'); if(!c) return; c.checked?done.add(c.dataset.k):done.delete(c.dataset.k); store.set('bts_sg_stamps',[...done]); renderStamps(); };
$('#stamps').onclick = e=>{ const g=e.target.closest('.go[data-v]'); if(g){ e.preventDefault(); focusVenue(g.dataset.v); } };
renderStamps();

/* ---------- 分頁、面板 ---------- */
$$('.tab').forEach(t=>t.onclick=()=>{ if(t.dataset.p==='ev'||t.dataset.p==='sp'){ itinLayer.clearLayers(); routeLayer.clearLayers(); curDay=null; curRoute=null; $$('.rt').forEach(x=>x.classList.remove('on')); $$('#dayRow .chip').forEach(x=>x.classList.remove('on')); map.getContainer().classList.remove('dim'); }
  $$('.tab').forEach(x=>x.classList.toggle('on',x===t)); $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t.dataset.p));
  if (t.dataset.p==='it' && curDay===null) showDay(Math.max(0, D.itin.findIndex(d=>d.d===ymd(sgtNow()))));
  if (isSheet() && getComputedStyle(document.documentElement).getPropertyValue('--sheet-h').trim()==='22vh') setSheet('half'); });
const SH = {peek:'22vh', half:'46vh', full:'86vh'};
function setSheet(s){ document.documentElement.style.setProperty('--sheet-h', SH[s]); setTimeout(()=>map.invalidateSize(),250); }
(function drag(){
  const g=$('#grab'), p=$('#panel'); let y0=null,h0=0;
  g.addEventListener('pointerdown',e=>{ y0=e.clientY; h0=p.getBoundingClientRect().height; p.classList.add('drag'); g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove',e=>{ if(y0===null) return; const h=Math.min(innerHeight*.9,Math.max(110,h0+(y0-e.clientY))); document.documentElement.style.setProperty('--sheet-h',h+'px'); });
  g.addEventListener('pointerup',e=>{ if(y0===null) return; p.classList.remove('drag'); const r=p.getBoundingClientRect().height/innerHeight; const moved=Math.abs(e.clientY-y0)>6; y0=null;
    if(!moved){ setSheet(r<.3?'half':r<.6?'full':'peek'); return; } setSheet(r<.33?'peek':r<.66?'half':'full'); });
})();

/* ---------- 工具列 ---------- */
$('#btnNight').onclick = ()=>{ const on=!map.hasLayer(dark); Object.values(bases).forEach(l=>map.removeLayer(l)); (on?dark:carto).addTo(map); $('#btnNight').classList.toggle('on',on); };
map.on('baselayerchange',e=>$('#btnNight').classList.toggle('on', e.layer===dark));
let me=null;
$('#btnLoc').onclick = ()=>{ if(!navigator.geolocation){ toast('此瀏覽器不支援定位'); return; }
  toast('定位中…'); navigator.geolocation.getCurrentPosition(pos=>{ const ll=[pos.coords.latitude,pos.coords.longitude];
    if(me) map.removeLayer(me); me=L.layerGroup([L.circle(ll,{radius:pos.coords.accuracy,color:'#2563eb',weight:1,fillOpacity:.1}),L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1})]).addTo(map);
    map.setView(ll,16); }, err=>toast('無法取得位置：'+err.message), {enableHighAccuracy:true,timeout:10000}); };
$('#btnMenu').onclick = e=>{ e.stopPropagation(); const m=$('#menu'); m.style.display = m.style.display==='block'?'none':'block'; };
document.addEventListener('click',e=>{ if(!e.target.closest('#menu')) $('#menu').style.display='none'; });
$('#menu').onclick = e=>{ const b=e.target.closest('button[data-x]'); if(!b) return; const x=b.dataset.x; $('#menu').style.display='none';
  if(x==='all') fitTo(L.latLngBounds([[1.243,103.78],[1.41,103.995]])); else exportData(x); };
function dl(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function exportData(x){
  const rows=[]; D.programs.forEach(p=>{ (p.v.length?p.v:[null]).forEach(k=>rows.push([p,k])); });
  if(x==='geojson'){ dl('BTS_THE_CITY_ARIRANG_SG_2026.geojson', JSON.stringify({type:'FeatureCollection',features:rows.filter(r=>r[1]).map(([p,k])=>({type:'Feature',geometry:{type:'Point',coordinates:[VEN[k][3],VEN[k][2]]},properties:{id:p.id,category:D.cats[p.cat][0],title:p.t,desc:p.zh,venue:VEN[k][0],address:VEN[k][4],dates:fmtRange(p),time:p.time,fee:FEE[p.fee][0],stamp:!!p.stamp}}))},null,1),'application/geo+json'); }
  if(x==='csv'){ const h=['編號','類別','活動','說明','地點','地址','緯度','經度','日期','時間(SGT)','費用','集章']; const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
    dl('BTS_THE_CITY_ARIRANG_SG_2026.csv','﻿'+[h.map(q).join(',')].concat(rows.map(([p,k])=>[p.id,D.cats[p.cat][0],p.t,p.zh,k?VEN[k][0]:'待公布／全島',k?VEN[k][4]:'',k?VEN[k][2]:'',k?VEN[k][3]:'',fmtRange(p),p.time,FEE[p.fee][0],p.stamp?'★':''].map(q).join(','))).join('\n'),'text/csv;charset=utf-8'); }
  if(x==='kml'){ const ex=s=>String(s).replace(/[<&]/g,c=>c==='<'?'&lt;':'&amp;');
    dl('BTS_THE_CITY_ARIRANG_SG_2026.kml',`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>BTS THE CITY ARIRANG SINGAPORE 2026</name>`+
      Object.keys(markers).map(k=>`<Placemark><name>${ex(VEN[k][0])}</name><description><![CDATA[${venueProgs[k].map(p=>`${p.stamp?'★':''}[${D.cats[p.cat][0]}] ${p.t}｜${fmtRange(p)}｜${p.time}`).join('<br>')}]]></description><Point><coordinates>${VEN[k][3]},${VEN[k][2]},0</coordinates></Point></Placemark>`).join('')+
      `</Document></kml>`,'application/vnd.google-earth.kml+xml'); }
}
setInterval(()=>{ if(F.live) render(); }, 60000);
</script>
